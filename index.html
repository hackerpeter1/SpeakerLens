<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SpeakerLens 系统展示</title>


<style>

:root{
    --ink:#18212f;
    --muted:#627086;
    --line:#d8dee8;
    --panel:#f7f9fc;
    --accent:#0f766e;
    --accent-soft:#dff5f1;
}


*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

    color:var(--ink);

    background:white;

}



main{

    width:min(980px, calc(100% - 32px));

    margin:auto;

    padding:48px 0 72px;

}



header{

    border-bottom:1px solid var(--line);

    padding-bottom:25px;

}



h1{

    font-size:42px;

}



h2{

    margin-top:35px;

}



blockquote{

    background:var(--panel);

    border-left:4px solid var(--accent);

    padding:15px 18px;

    color:var(--muted);

}



.audio-picker{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

}



.audio-option{

    padding:10px 18px;

    border-radius:6px;

    border:1px solid var(--line);

    background:white;

    cursor:pointer;

}



.audio-option[aria-pressed="true"]{

    background:var(--accent-soft);

    border-color:var(--accent);

    font-weight:bold;

}



.stage{

    margin-top:15px;

    padding:18px;

    border-radius:8px;

    background:var(--panel);

    border:1px solid var(--line);

}



audio{

    width:100%;

}



img{

    width:100%;

    max-height:520px;

    object-fit:contain;

    background:white;

    border-radius:6px;

}



button.switch-btn{

    margin-top:15px;

    padding:8px 16px;

    border-radius:6px;

    border:1px solid var(--accent);

    background:white;

    cursor:pointer;

}



pre{

    background:white;

    border:1px solid var(--line);

    border-radius:6px;

    padding:15px;

    white-space:pre-wrap;

}



code{

    display:block;

    margin-top:10px;

    background:white;

    padding:10px;

}



.label{

    color:var(--muted);

    font-size:14px;

}


</style>


</head>


<body>


<main>


<header>


<blockquote>

<p><b>Motivation:</b> better Speaker Reco</p>

<p><b>Keywords:</b> Speaker Reco, XAI</p>


</blockquote>


<h1>SpeakerLens 系统展示</h1>


</header>





<section>


<h2>音频</h2>


<div class="audio-picker">


<button
class="audio-option"
aria-pressed="true"

data-src="assets/audio/audio_a.wav"

data-localization="assets/localization/audio_a.png"

data-annotation="assets/localization/audio_a_annotation.png"

data-explanation="assets/text/audio_a_zh.txt"

data-polish="assets/polish/audio_a_zh.txt">

Audio A

</button>





<button
class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_b.wav"

data-localization="assets/localization/audio_b.png"

data-annotation="assets/localization/audio_b_annotation.png"

data-explanation="assets/text/audio_b_zh.txt"

data-polish="assets/polish/audio_b_zh.txt">

Audio B

</button>





<button
class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_c.wav"

data-localization="assets/localization/audio_c.png"

data-annotation="assets/localization/audio_c_annotation.png"

data-explanation="assets/text/audio_c_zh.txt"

data-polish="assets/polish/audio_c_zh.txt">

Audio C

</button>





<button
class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_d.wav"

data-localization="assets/localization/audio_d.png"

data-annotation="assets/localization/audio_d_annotation.png"

data-explanation="assets/text/audio_d_zh.txt"

data-polish="assets/polish/audio_d_zh.txt">

Audio D

</button>





<button
class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_e.wav"

data-localization="assets/localization/audio_e.png"

data-annotation="assets/localization/audio_e_annotation.png"

data-explanation="assets/text/audio_e_zh.txt"

data-polish="assets/polish/audio_e_zh.txt">

Audio E

</button>


</div>






<div class="stage">


<audio id="audioPlayer" controls>

<source id="audioSource"

src="assets/audio/audio_a.wav"

type="audio/wav">


</audio>



<span class="label">
audio source
</span>


<code id="sourceText">
assets/audio/audio_a.wav
</code>


</div>


</section>








<section>


<h2>定位</h2>


<div class="stage">


<img id="localizationImage"

src="assets/localization/audio_a.png">


<button

id="annotationButton"

class="switch-btn">

显示轨迹

</button>



<code id="localizationText">

assets/localization/audio_a.png

</code>


</div>


</section>
