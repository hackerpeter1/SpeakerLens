<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SpeakerLens 系统展示</title>


<style>

:root{
    --ink:#18212f;
    --muted:#627086;
    --line:#d8dee8;
    --panel:#f7f9fc;
    --accent:#0f766e;
    --accent-soft:#dff5f1;
}


*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

    color:var(--ink);

}


main{

    width:min(980px, calc(100% - 32px));

    margin:auto;

    padding:48px 0;

}


header{

    border-bottom:1px solid var(--line);

    padding-bottom:24px;

}


h1{

    font-size:40px;

}


h2{

    margin-top:35px;

}


blockquote{

    background:var(--panel);

    border-left:4px solid var(--accent);

    padding:15px;

}



.audio-picker{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}



.audio-option{

    padding:10px 16px;

    border:1px solid var(--line);

    background:white;

    border-radius:6px;

    cursor:pointer;

}



.audio-option[aria-pressed="true"]{

    background:var(--accent-soft);

    border-color:var(--accent);

}



.stage{

    margin-top:15px;

    padding:18px;

    background:var(--panel);

    border:1px solid var(--line);

    border-radius:8px;

}



audio{

    width:100%;

}



img{

    width:100%;

    max-height:500px;

    object-fit:contain;

    background:white;

}



pre{

    white-space:pre-wrap;

    background:white;

    padding:15px;

    border:1px solid var(--line);

    border-radius:6px;

}


code{

    display:block;

    background:white;

    padding:10px;

}


.label{

    color:var(--muted);

    font-size:14px;

}



</style>

</head>



<body>


<main>


<header>

<blockquote>

<p><b>Motivation:</b> better Speaker Reco</p>

<p><b>Keywords:</b> Speaker Reco, XAI</p>

</blockquote>


<h1>SpeakerLens 系统展示</h1>


</header>




<section>


<h2>音频</h2>


<div class="audio-picker">


<button class="audio-option"
aria-pressed="true"

data-src="assets/audio/audio_a.wav"

data-localization="assets/localization/audio_a.png"

data-explanation="assets/text/audio_a.txt"

data-polish="assets/polish/audio_a.txt">

Audio A

</button>



<button class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_b.wav"

data-localization="assets/localization/audio_b.png"

data-explanation="assets/text/audio_b.txt"

data-polish="assets/polish/audio_b.txt">

Audio B

</button>



<button class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_c.wav"

data-localization="assets/localization/audio_c.png"

data-explanation="assets/text/audio_c.txt"

data-polish="assets/polish/audio_c.txt">

Audio C

</button>



<button class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_d.wav"

data-localization="assets/localization/audio_d.png"

data-explanation="assets/text/audio_d.txt"

data-polish="assets/polish/audio_d.txt">

Audio D

</button>



<button class="audio-option"
aria-pressed="false"

data-src="assets/audio/audio_e.wav"

data-localization="assets/localization/audio_e.png"

data-explanation="assets/text/audio_e.txt"

data-polish="assets/polish/audio_e.txt">

Audio E

</button>


</div>



<div class="stage">


<audio id="audioPlayer" controls>

<source id="audioSource"

src="assets/audio/audio_a.wav"

type="audio/wav">

</audio>



<span class="label">

audio source

</span>


<code id="sourceText">

assets/audio/audio_a.wav

</code>


</div>


</section>







<section>


<h2>定位</h2>


<div class="stage">


<img id="localizationImage"

src="assets/localization/audio_a.png">


<span class="label">

localization image source

</span>


<code id="localizationText">

assets/localization/audio_a.png

</code>


</div>


</section>







<section>


<h2>解释</h2>


<div class="stage">

<pre id="explanationText">

Loading explanation...

</pre>

</div>


</section>








<section>


<h2>润色</h2>


<div class="stage">

<pre id="polishText">

Loading polish...

</pre>


</div>


</section>







<section>

<h2>对比</h2>

<p>
这里后续展示不同方法之间的比较。
</p>

</section>





<section>

<h2>问询</h2>

<p>
这里后续接入 LLM 问答模块。
</p>

</section>




</main>






<script>


const buttons =
document.querySelectorAll(".audio-option");


const player =
document.querySelector("#audioPlayer");


const source =
document.querySelector("#audioSource");


const sourceText =
document.querySelector("#sourceText");


const localizationImage =
document.querySelector("#localizationImage");


const localizationText =
document.querySelector("#localizationText");


const explanationText =
document.querySelector("#explanationText");


const polishText =
document.querySelector("#polishText");





async function loadText(path, element, fallback){


    try{


        const response =
        await fetch(path);


        if(!response.ok){

            throw new Error(
                "File not found: " + path
            );

        }


        const text =
        await response.text();


        element.textContent=text;


    }
    catch(error){


        console.error(error);


        element.textContent=fallback;


    }

}







buttons.forEach(button=>{


button.addEventListener("click",()=>{


    buttons.forEach(b=>{

        b.setAttribute(
            "aria-pressed",
            "false"
        );

    });


    button.setAttribute(
        "aria-pressed",
        "true"
    );



    const audio =
    button.dataset.src;


    const image =
    button.dataset.localization;


    const explanation =
    button.dataset.explanation;


    const polish =
    button.dataset.polish;




    source.src=audio;

    sourceText.textContent=audio;

    player.load();




    localizationImage.src=image;

    localizationText.textContent=image;




    loadText(
        explanation,
        explanationText,
        "Explanation unavailable."
    );



    loadText(
        polish,
        polishText,
        "Polish unavailable."
    );



});


});






// initial load

loadText(

"assets/text/audio_a.txt",

explanationText,

"Explanation unavailable."

);



loadText(

"assets/polish/audio_a.txt",

polishText,

"Polish unavailable."

);



</script>



</body>

</html>
