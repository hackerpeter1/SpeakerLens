<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
SpeakerLens | Black Gold XAI System
</title>


<style>


:root{

--black:#050403;

--black-panel:#0d0a06;

--gold:#d4af37;

--gold-light:#ffe7a0;

--gold-dark:#8c6b1f;

--text:#f8f1df;

--muted:#a89b7a;

--border:
rgba(212,175,55,.28);

}



*{

box-sizing:border-box;

}



body{


margin:0;


font-family:

Inter,
"Segoe UI",
Arial,
sans-serif;



background:


radial-gradient(

circle at top,

#33240b,

#050403 60%

);



color:

var(--text);


min-height:100vh;


}



main{


width:min(1200px,calc(100% - 40px));


margin:auto;


padding:40px 0 100px;


}





/* HEADER */


header{


padding:40px;



background:


linear-gradient(

145deg,

rgba(255,255,255,.08),

rgba(0,0,0,.65)

);



border:

1px solid var(--border);



border-radius:25px;



box-shadow:


0 0 50px

rgba(212,175,55,.15);



}



.badge{


display:inline-block;


padding:8px 18px;


border-radius:30px;


border:

1px solid var(--gold);



color:

var(--gold-light);



font-size:13px;


letter-spacing:3px;


}



h1{


font-size:52px;


margin:20px 0;



background:


linear-gradient(

90deg,

#fff6d5,

#d4af37

);



-webkit-background-clip:text;


color:transparent;


letter-spacing:2px;


}




.subtitle{


font-size:20px;


color:

var(--muted);


}



.keyword{


margin-top:20px;


color:#d8c99a;


}





/* PANEL */


.card{


margin-top:30px;


padding:32px;



background:


linear-gradient(

145deg,

rgba(255,255,255,.06),

rgba(0,0,0,.55)

);



border:


1px solid var(--border);



border-radius:22px;



backdrop-filter:

blur(20px);



box-shadow:


0 0 35px

rgba(212,175,55,.08);



}




.card-title{


font-size:21px;


margin-bottom:25px;


letter-spacing:2px;


font-weight:600;



color:


var(--gold-light);



}





/* AUDIO BUTTON */


.audio-picker{


display:flex;


flex-wrap:wrap;


gap:14px;


}



.audio-option{


padding:13px 28px;


border-radius:12px;


cursor:pointer;



background:


rgba(0,0,0,.45);



border:

1px solid rgba(212,175,55,.25);



color:

var(--text);



transition:.3s;


}



.audio-option:hover{


border-color:

var(--gold);



transform:

translateY(-3px);


}



.audio-option[aria-pressed="true"]{


background:


linear-gradient(

135deg,

#ffe7a0,

#d4af37,

#8c6b1f

);



color:#120c02;



box-shadow:


0 0 30px

rgba(212,175,55,.5);



font-weight:bold;


}





/* AUDIO */


audio{


width:100%;


margin-top:25px;


}




.signal-box{


height:120px;


margin-top:25px;



display:flex;


justify-content:center;


align-items:center;



background:

rgba(0,0,0,.45);



border:


1px solid rgba(212,175,55,.2);



border-radius:18px;


}



.wave{


display:flex;


gap:6px;


}



.wave span{


width:5px;


height:35px;


background:

var(--gold);



box-shadow:


0 0 15px

var(--gold);



animation:

wave 1s infinite alternate;


}



.wave span:nth-child(2n){

animation-delay:.2s;

}



.wave span:nth-child(3n){

animation-delay:.4s;

}



@keyframes wave{


from{

height:20px;

opacity:.3;

}


to{

height:90px;

opacity:1;

}


}





/* PIPELINE */


.pipeline{


display:grid;


grid-template-columns:

repeat(4,1fr);


gap:18px;


}



.node{


padding:25px;


text-align:center;



background:


rgba(0,0,0,.45);



border:


1px solid rgba(212,175,55,.25);



border-radius:18px;


}



.node-icon{


font-size:34px;


color:

var(--gold);


margin-bottom:12px;


}



.node p{


font-size:13px;


color:

var(--muted);


}





/* BUTTON */


.process{


margin-top:35px;


padding:17px 45px;


border:none;


border-radius:15px;


cursor:pointer;



font-weight:bold;


font-size:16px;



background:


linear-gradient(

135deg,

#fff0b3,

#d4af37,

#8c6b1f

);



color:#160e02;



box-shadow:


0 0 45px

rgba(212,175,55,.55);



}




.process:disabled{


opacity:.5;


}






/* IMAGE FRAME */


.image-frame{


padding:15px;



border-radius:25px;



background:


linear-gradient(

135deg,

rgba(212,175,55,.55),

rgba(140,107,31,.15)

);



box-shadow:


0 0 40px

rgba(212,175,55,.25);



}




img{


width:100%;


max-height:550px;


object-fit:contain;



padding:20px;



background:#090704;



border-radius:18px;



border:


2px solid rgba(212,175,55,.35);



filter:


contrast(1.15)
brightness(1.12);



}






/* TEXT DISPLAY */


pre{


white-space:pre-wrap;



font-family:


Inter,
"Segoe UI",
Arial,
sans-serif;



font-size:16px;


line-height:2;



letter-spacing:.3px;



padding:30px;



background:


linear-gradient(

145deg,

rgba(212,175,55,.08),

rgba(0,0,0,.65)

);



border:


1px solid rgba(212,175,55,.35);



border-left:


4px solid var(--gold);



border-radius:16px;



color:

#f8e9b0;



box-shadow:


inset 0 0 30px

rgba(212,175,55,.08);



}




.switch{


margin-top:18px;


padding:12px 25px;



background:

transparent;



border:


1px solid var(--gold);



border-radius:10px;



color:

var(--gold-light);



cursor:pointer;



}



@media(max-width:850px){


.pipeline{

grid-template-columns:

1fr;

}


h1{

font-size:36px;

}


}



</style>

</head>


<body>


<main>


<header>


<div class="badge">

BLACK GOLD XAI LAB

</div>


<h1>

SpeakerLens

</h1>


<div class="subtitle">

Explainable AI Framework for
Second-Order Speaker Pattern Recognition

</div>


<div class="keyword">

XAI · Speaker Recognition · Hierarchical Representation · LLM Reasoning

</div>


</header>
